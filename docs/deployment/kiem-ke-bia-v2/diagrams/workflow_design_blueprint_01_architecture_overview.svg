    <text x="532" y="421" font-size="13" fill="#1e293b">đối soát · đóng ngày</text>
    <text x="532" y="440" font-size="12" fill="#475569">tạo báo cáo ngày có phiên bản</text>
  </g>
  <g>
    <rect x="745" y="367" width="195" height="90" rx="13" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
