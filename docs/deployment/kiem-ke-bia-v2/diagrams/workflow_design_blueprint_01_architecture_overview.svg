    <text x="72" y="440" font-size="12" fill="#475569">mỗi chi nhánh/ngày</text>
  </g>
  <g>
    <rect x="285" y="367" width="195" height="90" rx="13" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="302" y="396" font-size="16" font-weight="700" fill="#0c4a6e">WF06 · Count Intake</text>
    <text x="302" y="421" font-size="13" fill="#1e293b">nhập / sửa / chốt số đếm</text>
    <text x="302" y="440" font-size="12" fill="#475569">0 hợp lệ · số âm bị từ chối</text>
  </g>
  <g>
