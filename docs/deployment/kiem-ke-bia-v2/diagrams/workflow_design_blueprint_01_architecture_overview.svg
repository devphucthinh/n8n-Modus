    <text x="762" y="421" font-size="13" fill="#1e293b">tổng hợp / xuất báo cáo</text>
    <text x="762" y="440" font-size="12" fill="#475569">theo quyền và policy</text>
  </g>
  <g>
    <rect x="975" y="367" width="195" height="90" rx="13" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="992" y="396" font-size="16" font-weight="700" fill="#4c1d95">WF11 · Weekly Archive</text>
    <text x="992" y="421" font-size="13" fill="#1e293b">đóng gói / xác minh lưu trữ</text>
    <text x="992" y="440" font-size="12" fill="#475569">chỉ dọn sau khi xác minh</text>
  </g>
  <path d="M250 412 L282 412" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M480 412 L512 412" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
