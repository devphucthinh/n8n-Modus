<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 900" role="img" aria-labelledby="title desc" style="font-family:Inter,Segoe UI,Arial,sans-serif">
  <title id="title">Kiến trúc nghiệm thu E2E — 12 workflow</title>
  <desc id="desc">Hai điểm vào WF03 và WF04, dịch vụ cấu hình WF01, xử lý lỗi WF02, chuỗi nghiệp vụ WF05 đến WF11, WF08 và WF09 cấp dữ liệu cho WF07, WF12 backup và khôi phục; tất cả chạy trong môi trường E2E test cô lập.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
    <marker id="arrowDash" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker>
  </defs>
  <rect x="14" y="14" width="1212" height="870" rx="24" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <rect x="36" y="30" width="390" height="34" rx="17" fill="#dbeafe"/>
  <text x="54" y="53" font-size="16" font-weight="700" fill="#123c68">RAN TRONG TEST STACK RIÊNG — KHÔNG PHẢI PRODUCTION</text>

  <g>
    <rect x="55" y="88" width="250" height="88" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="75" y="117" font-size="17" font-weight="700" fill="#123c68">WF03 · Telegram Router</text>
    <text x="75" y="143" font-size="14" fill="#1e293b">Điểm vào Telegram duy nhất</text>
    <text x="75" y="162" font-size="13" fill="#475569">lệnh / callback → worker phù hợp</text>
  </g>
  <g>
    <rect x="935" y="88" width="250" height="88" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="955" y="117" font-size="17" font-weight="700" fill="#123c68">WF04 · Dispatcher</text>
    <text x="955" y="143" font-size="14" fill="#1e293b">Tick 10 phút / chạy test có kiểm soát</text>
    <text x="955" y="162" font-size="13" fill="#475569">lịch nghiệp vụ lấy từ WF01</text>
  </g>
  <g>
    <rect x="495" y="88" width="250" height="88" rx="14" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
    <text x="515" y="117" font-size="17" font-weight="700" fill="#14532d">WF01 · Config Gateway</text>
    <text x="515" y="143" font-size="14" fill="#1e293b">kiểm tra cấu hình + snapshot</text>
    <text x="515" y="162" font-size="13" fill="#475569">workers lấy config qua WF01</text>
  </g>
  <g>
    <rect x="495" y="199" width="250" height="78" rx="14" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/>
    <text x="515" y="228" font-size="17" font-weight="700" fill="#7c2d12">WF02 · Error Handler</text>
    <text x="515" y="253" font-size="13" fill="#1e293b">nhận lỗi worker · redact · phân loại · audit</text>
  </g>
  <path d="M305 130 C380 130 410 130 492 130" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M935 145 C855 190 815 168 747 151" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="348" y="119" font-size="12" fill="#475569">đọc policy/config</text>
  <text x="797" y="184" font-size="12" fill="#475569">đọc policy/config</text>

  <rect x="35" y="303" width="1170" height="358" rx="20" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="58" y="333" font-size="16" font-weight="700" fill="#334155">CÁC LUỒNG NGHIỆP VỤ — phụ thuộc logic giữa workflow</text>
  <text x="58" y="353" font-size="12" fill="#475569">WF03 gọi: WF05 / WF06 / WF08 / WF09 / WF10</text>
  <text x="632" y="353" font-size="12" fill="#475569">WF04 gọi: WF05 / WF07 / WF10 / WF11 / WF12</text>
  <path d="M620 303 L620 280" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrowDash)"/>
