  <path d="M940 412 L972 412" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="255" y="520" width="205" height="86" rx="13" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="273" y="549" font-size="16" font-weight="700" fill="#78350f">WF08 · Invoice Ingestion</text>
    <text x="273" y="574" font-size="13" fill="#1e293b">Drive evidence → OCR → review</text>
    <text x="273" y="592" font-size="12" fill="#475569">chỉ dòng đã xác nhận mới publish</text>
  </g>
  <g>
    <rect x="505" y="520" width="205" height="86" rx="13" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="523" y="549" font-size="16" font-weight="700" fill="#78350f">WF09 · Sales Ingestion</text>
    <text x="523" y="574" font-size="13" fill="#1e293b">nạp / kiểm tra / publish doanh số</text>
    <text x="523" y="592" font-size="12" fill="#475569">bản ghi theo version</text>
  </g>
  <g>
    <rect x="895" y="520" width="245" height="86" rx="13" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="913" y="549" font-size="16" font-weight="700" fill="#7f1d1d">WF12 · Backup / Recovery</text>
    <text x="913" y="574" font-size="13" fill="#1e293b">backup đầy đủ · restore ra file mới</text>
    <text x="913" y="592" font-size="12" fill="#475569">WF04 gọi · chủ sở hữu duyệt restore</text>
  </g>
