  <text x="58" y="824" font-size="13" fill="#334155">🔐 Credential chỉ nằm trong n8n Credentials; không nhúng token/secret vào JSON workflow hoặc tài liệu.</text>
  <rect x="55" y="841" width="1115" height="29" rx="10" fill="#dcfce7" stroke="#15803d"/>
  <text x="72" y="861" font-size="14" font-weight="700" fill="#14532d">NGHIỆM THU CUỐI: chạy một chiến dịch E2E tích hợp sau khi đủ 12/12 workflow · kiểm tra Telegram + Sheet + Drive + audit/error · không ghi production</text>
